[pytest]
testpaths = tests
# `submits` and `tyler_write` are deselected by default. TESTING_RULES.md rule 10 requires the
# full suite on every change and the pre-push hook enforces it, so anything selected here runs
# on every push - which must never mean filing a real envelope or writing to Tyler. Run them
# deliberately instead:
#   pytest -m submits        files a real envelope on Tyler stage
#   pytest -m tyler_write    runs the submit path up to the send (registers service contacts)
addopts = -ra --strict-markers -m "not submits and not tyler_write"
markers =
    db: reads LawBase_Design (needs network access to SVTUSLAWBASESQL)
    tyler: makes live read-only Tyler stage calls (slow - CaseSearch/GetCase)
    tyler_write: runs a path that can WRITE to Tyler without submitting an envelope - today
        --preview-summary, which registers service contacts before it stops. Deselected by default.
    submits: SUBMITS a real envelope to Tyler stage. Deselected by default.
